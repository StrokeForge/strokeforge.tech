    <script>
    // Functions helper
    const F = {
        dig: (n) => `<span class="fn fn-dig">D${n}</span>`,
        pwm: () => `<span class="fn fn-pwm">PWM</span>`,
        adc: (ch) => `<span class="fn fn-adc">ADC${ch !== undefined ? ch : ''}</span>`,
        i2c: (role) => `<span class="fn fn-i2c">I²C ${role}</span>`,
        spi: (role) => `<span class="fn fn-spi">SPI ${role}</span>`,
        uart: (n, role) => `<span class="fn fn-uart">UART${n || ''} ${role}</span>`,
        int: (n) => `<span class="fn fn-int">INT${n !== undefined ? n : ''}</span>`,
        pwr: (v) => `<span class="fn fn-pwr">${v}</span>`,
        led: () => `<span class="fn fn-led">LED</span>`,
        touch: (n) => `<span class="fn fn-touch">Touch${n !== undefined ? n : ''}</span>`,
        dac: (n) => `<span class="fn fn-dac">DAC${n !== undefined ? n : ''}</span>`,
        rtc: () => `<span class="fn fn-rtc">RTC</span>`,
        onlyIn: () => `<span class="fn fn-only-in">Input only</span>`,
        warn: (t) => `<span class="fn fn-warn">${t}</span>`,
    };

    const PLATFORMS = {

        uno: {
            notes: `<h3>Arduino Uno (ATmega328P) — Key Points</h3><ul>
                <li>5 V I/O; max 40 mA per pin, 200 mA total</li>
                <li>D0/D1 shared with USB serial — avoid during programming</li>
                <li>PWM at ~490 Hz (D5/D6 ~980 Hz)</li>
                <li>analogWrite() range: 0–255 (8-bit)</li>
                <li>I²C uses A4 (SDA) + A5 (SCL); 5 V levels, add 4.7 kΩ pull-ups</li>
                <li>SPI: D10 (SS), D11 (MOSI), D12 (MISO), D13 (SCK)</li>
            </ul>`,
            rows: [
                { pin: 'D0',  name: 'RX',   fns: [F.dig(0), F.uart(0,'RX')],              tags: ['uart'], notes: 'Serial RX — shared with USB; avoid in projects using Serial' },
                { pin: 'D1',  name: 'TX',   fns: [F.dig(1), F.uart(0,'TX')],              tags: ['uart'], notes: 'Serial TX — shared with USB' },
                { pin: 'D2',  name: 'D2',   fns: [F.dig(2), F.int(0)],                    tags: ['int'],  notes: 'External interrupt INT0' },
                { pin: 'D3',  name: 'D3',   fns: [F.dig(3), F.pwm(), F.int(1)],           tags: ['pwm','int'], notes: 'PWM + External interrupt INT1' },
                { pin: 'D4',  name: 'D4',   fns: [F.dig(4)],                              tags: [], notes: 'General purpose digital' },
                { pin: 'D5',  name: 'D5',   fns: [F.dig(5), F.pwm()],                     tags: ['pwm'], notes: 'PWM ~980 Hz (Timer0)' },
                { pin: 'D6',  name: 'D6',   fns: [F.dig(6), F.pwm()],                     tags: ['pwm'], notes: 'PWM ~980 Hz (Timer0)' },
                { pin: 'D7',  name: 'D7',   fns: [F.dig(7)],                              tags: [], notes: 'General purpose digital' },
                { pin: 'D8',  name: 'D8',   fns: [F.dig(8)],                              tags: [], notes: 'General purpose digital' },
                { pin: 'D9',  name: 'D9',   fns: [F.dig(9), F.pwm()],                     tags: ['pwm'], notes: 'PWM ~490 Hz (Timer1)' },
                { pin: 'D10', name: 'SS',   fns: [F.dig(10), F.pwm(), F.spi('SS')],       tags: ['pwm','spi'], notes: 'SPI Slave Select; PWM ~490 Hz' },
                { pin: 'D11', name: 'MOSI', fns: [F.dig(11), F.pwm(), F.spi('MOSI')],     tags: ['pwm','spi'], notes: 'SPI MOSI; PWM ~490 Hz' },
                { pin: 'D12', name: 'MISO', fns: [F.dig(12), F.spi('MISO')],              tags: ['spi'], notes: 'SPI MISO' },
                { pin: 'D13', name: 'SCK',  fns: [F.dig(13), F.spi('SCK'), F.led()],      tags: ['spi'], notes: 'SPI Clock; onboard LED (active HIGH)' },
                { pin: 'A0',  name: 'A0',   fns: [F.adc(0), F.dig(14)],                   tags: ['adc'], notes: '10-bit ADC; usable as digital D14' },
                { pin: 'A1',  name: 'A1',   fns: [F.adc(1), F.dig(15)],                   tags: ['adc'], notes: '10-bit ADC; usable as D15' },
                { pin: 'A2',  name: 'A2',   fns: [F.adc(2), F.dig(16)],                   tags: ['adc'], notes: '10-bit ADC; usable as D16' },
                { pin: 'A3',  name: 'A3',   fns: [F.adc(3), F.dig(17)],                   tags: ['adc'], notes: '10-bit ADC; usable as D17' },
                { pin: 'A4',  name: 'SDA',  fns: [F.adc(4), F.dig(18), F.i2c('SDA')],     tags: ['adc','i2c'], notes: 'I²C Data + ADC channel 4' },
                { pin: 'A5',  name: 'SCL',  fns: [F.adc(5), F.dig(19), F.i2c('SCL')],     tags: ['adc','i2c'], notes: 'I²C Clock + ADC channel 5' },
                { pin: '5V',  name: '5V',   fns: [F.pwr('5 V out')],                       tags: [], notes: 'Regulated 5 V output (~500 mA via USB)' },
                { pin: '3V3', name: '3.3V', fns: [F.pwr('3.3 V out')],                     tags: [], notes: '3.3 V output from on-board regulator (~50 mA)' },
                { pin: 'GND', name: 'GND',  fns: [F.pwr('GND')],                           tags: [], notes: 'Ground' },
                { pin: 'VIN', name: 'VIN',  fns: [F.pwr('VIN')],                           tags: [], notes: '7–12 V input to on-board regulator' },
                { pin: 'RST', name: 'RESET',fns: [F.pwr('RESET')],                         tags: [], notes: 'Pull LOW to reset the microcontroller' },
            ]
        },

        nano: {
            notes: `<h3>Arduino Nano (ATmega328P) — Key Points</h3><ul>
                <li>Same MCU as Uno — identical pin functions, smaller package</li>
                <li>Mini-USB or USB-C (newer revision) for programming</li>
                <li>A6 and A7 are <strong>analog-input only</strong> — cannot be used as digital</li>
                <li>No dedicated ICSP header; SPI accessible on D10–D13</li>
                <li>5 V I/O; 40 mA per pin, 200 mA total</li>
            </ul>`,
            rows: [
                { pin: 'D0',  name: 'RX',   fns: [F.dig(0), F.uart(0,'RX')],          tags: ['uart'], notes: 'Serial RX — shared with USB' },
                { pin: 'D1',  name: 'TX',   fns: [F.dig(1), F.uart(0,'TX')],          tags: ['uart'], notes: 'Serial TX — shared with USB' },
                { pin: 'D2',  name: 'D2',   fns: [F.dig(2), F.int(0)],                tags: ['int'],  notes: 'INT0' },
                { pin: 'D3',  name: 'D3',   fns: [F.dig(3), F.pwm(), F.int(1)],       tags: ['pwm','int'], notes: 'PWM + INT1' },
                { pin: 'D4',  name: 'D4',   fns: [F.dig(4)],                          tags: [], notes: '' },
                { pin: 'D5',  name: 'D5',   fns: [F.dig(5), F.pwm()],                 tags: ['pwm'], notes: 'PWM ~980 Hz' },
                { pin: 'D6',  name: 'D6',   fns: [F.dig(6), F.pwm()],                 tags: ['pwm'], notes: 'PWM ~980 Hz' },
                { pin: 'D7',  name: 'D7',   fns: [F.dig(7)],                          tags: [], notes: '' },
                { pin: 'D8',  name: 'D8',   fns: [F.dig(8)],                          tags: [], notes: '' },
                { pin: 'D9',  name: 'D9',   fns: [F.dig(9), F.pwm()],                 tags: ['pwm'], notes: 'PWM ~490 Hz' },
                { pin: 'D10', name: 'SS',   fns: [F.dig(10), F.pwm(), F.spi('SS')],   tags: ['pwm','spi'], notes: 'SPI SS; PWM' },
                { pin: 'D11', name: 'MOSI', fns: [F.dig(11), F.pwm(), F.spi('MOSI')], tags: ['pwm','spi'], notes: 'SPI MOSI; PWM' },
                { pin: 'D12', name: 'MISO', fns: [F.dig(12), F.spi('MISO')],          tags: ['spi'], notes: 'SPI MISO' },
                { pin: 'D13', name: 'SCK',  fns: [F.dig(13), F.spi('SCK'), F.led()],  tags: ['spi'], notes: 'SPI CLK; onboard LED' },
                { pin: 'A0',  name: 'A0',   fns: [F.adc(0), F.dig(14)],               tags: ['adc'], notes: '10-bit ADC / digital D14' },
                { pin: 'A1',  name: 'A1',   fns: [F.adc(1), F.dig(15)],               tags: ['adc'], notes: '' },
                { pin: 'A2',  name: 'A2',   fns: [F.adc(2), F.dig(16)],               tags: ['adc'], notes: '' },
                { pin: 'A3',  name: 'A3',   fns: [F.adc(3), F.dig(17)],               tags: ['adc'], notes: '' },
                { pin: 'A4',  name: 'SDA',  fns: [F.adc(4), F.dig(18), F.i2c('SDA')], tags: ['adc','i2c'], notes: 'I²C SDA + ADC4' },
                { pin: 'A5',  name: 'SCL',  fns: [F.adc(5), F.dig(19), F.i2c('SCL')], tags: ['adc','i2c'], notes: 'I²C SCL + ADC5' },
                { pin: 'A6',  name: 'A6',   fns: [F.adc(6), F.onlyIn()],              tags: ['adc'], notes: 'Analog input ONLY — no digital use' },
                { pin: 'A7',  name: 'A7',   fns: [F.adc(7), F.onlyIn()],              tags: ['adc'], notes: 'Analog input ONLY — no digital use' },
                { pin: '5V',  name: '5V',   fns: [F.pwr('5 V out')],                   tags: [], notes: '' },
                { pin: '3V3', name: '3.3V', fns: [F.pwr('3.3 V out')],                 tags: [], notes: '' },
                { pin: 'GND', name: 'GND',  fns: [F.pwr('GND')],                       tags: [], notes: '' },
                { pin: 'VIN', name: 'VIN',  fns: [F.pwr('VIN')],                       tags: [], notes: '7–12 V input' },
            ]
        },

        mega: {
            notes: `<h3>Arduino Mega 2560 (ATmega2560) — Key Points</h3><ul>
                <li>5 V I/O; 40 mA per pin, 200 mA total</li>
                <li>54 digital I/O pins, 16 analog inputs, 15 PWM outputs</li>
                <li>4× UART hardware serial ports: Serial (D0/1), Serial1 (D18/19), Serial2 (D16/17), Serial3 (D14/15)</li>
                <li>I²C: D20 (SDA) + D21 (SCL)</li>
                <li>SPI (ICSP header): D50 (MISO), D51 (MOSI), D52 (SCK), D53 (SS)</li>
            </ul>`,
            rows: [
                { pin: 'D0',  name: 'RX0',  fns: [F.dig(0), F.uart(0,'RX')],           tags: ['uart'], notes: 'Serial0 RX — USB' },
                { pin: 'D1',  name: 'TX0',  fns: [F.dig(1), F.uart(0,'TX')],           tags: ['uart'], notes: 'Serial0 TX — USB' },
                { pin: 'D2',  name: 'D2',   fns: [F.dig(2), F.pwm(), F.int(4)],        tags: ['pwm','int'], notes: 'PWM; INT4' },
                { pin: 'D3',  name: 'D3',   fns: [F.dig(3), F.pwm(), F.int(5)],        tags: ['pwm','int'], notes: 'PWM; INT5' },
                { pin: 'D4',  name: 'D4',   fns: [F.dig(4), F.pwm()],                  tags: ['pwm'], notes: 'PWM' },
                { pin: 'D5',  name: 'D5',   fns: [F.dig(5), F.pwm()],                  tags: ['pwm'], notes: 'PWM' },
                { pin: 'D6',  name: 'D6',   fns: [F.dig(6), F.pwm()],                  tags: ['pwm'], notes: 'PWM' },
                { pin: 'D7',  name: 'D7',   fns: [F.dig(7), F.pwm()],                  tags: ['pwm'], notes: 'PWM' },
                { pin: 'D8',  name: 'D8',   fns: [F.dig(8), F.pwm()],                  tags: ['pwm'], notes: 'PWM' },
                { pin: 'D9',  name: 'D9',   fns: [F.dig(9), F.pwm()],                  tags: ['pwm'], notes: 'PWM' },
                { pin: 'D10', name: 'D10',  fns: [F.dig(10), F.pwm()],                 tags: ['pwm'], notes: 'PWM' },
                { pin: 'D11', name: 'D11',  fns: [F.dig(11), F.pwm()],                 tags: ['pwm'], notes: 'PWM' },
                { pin: 'D12', name: 'D12',  fns: [F.dig(12), F.pwm()],                 tags: ['pwm'], notes: 'PWM' },
                { pin: 'D13', name: 'D13',  fns: [F.dig(13), F.pwm(), F.led()],        tags: ['pwm'], notes: 'PWM; onboard LED' },
                { pin: 'D14', name: 'TX3',  fns: [F.dig(14), F.uart(3,'TX')],          tags: ['uart'], notes: 'Serial3 TX' },

        esp32: {
            notes: `<h3>ESP32 (WROOM-32 / DevKit) — Key Points</h3><ul>
                <li>3.3 V I/O — NOT 5 V tolerant; max 40 mA per pin</li>

                <li>GPIO6–11: connected to internal flash — <strong>do not use</strong></li>
                <li>GPIO0, GPIO2, GPIO15 affect boot mode — avoid pulling during reset</li>
                <li>ADC2 pins (GPIO0,2,4,12–15,25–27) <strong>cannot be used while WiFi is active</strong></li>

                { pin: 'GPIO21', name: 'SDA',     fns: [F.i2c('SDA')],                    tags: ['i2c'], notes: 'Default I²C SDA (Wire library)' },
                { pin: 'GPIO22', name: 'SCL',     fns: [F.i2c('SCL')],                    tags: ['i2c'], notes: 'Default I²C SCL (Wire library)' },
                { pin: 'GPIO23', name: 'GPIO23',  fns: [F.spi('MOSI')],                   tags: ['spi'], notes: 'VSPI MOSI' },
                { pin: 'GPIO25', name: 'GPIO25',  fns: [F.adc('2-ch8'), F.dac(1)],        tags: ['adc','dac'], notes: 'DAC1 — analog voltage output; ADC2' },
                { pin: 'GPIO26', name: 'GPIO26',  fns: [F.adc('2-ch9'), F.dac(2)],        tags: ['adc','dac'], notes: 'DAC2 — analog voltage output; ADC2' },
                { pin: 'GPIO27', name: 'GPIO27',  fns: [F.adc('2-ch7'), F.touch(7)],      tags: ['adc'], notes: 'ADC2 — no WiFi use' },
                { pin: 'GPIO32', name: 'GPIO32',  fns: [F.adc('1-ch4'), F.touch(9), F.rtc()], tags: ['adc'], notes: 'ADC1 — safe during WiFi' },
                { pin: 'GPIO33', name: 'GPIO33',  fns: [F.adc('1-ch5'), F.touch(8), F.rtc()], tags: ['adc'], notes: 'ADC1 — safe during WiFi' },
                { pin: 'GPIO34', name: 'GPIO34',  fns: [F.adc('1-ch6'), F.onlyIn()],      tags: ['adc'], notes: 'Input only — no output, no pull-up' },
                { pin: 'GPIO35', name: 'GPIO35',  fns: [F.adc('1-ch7'), F.onlyIn()],      tags: ['adc'], notes: 'Input only — no output, no pull-up' },
                { pin: 'GPIO36', name: 'VP',      fns: [F.adc('1-ch0'), F.onlyIn()],      tags: ['adc'], notes: 'Input only (VP); ADC1_CH0' },
                { pin: 'GPIO39', name: 'VN',      fns: [F.adc('1-ch3'), F.onlyIn()],      tags: ['adc'], notes: 'Input only (VN); ADC1_CH3' },
                { pin: 'GPIO6–11', name: 'FLASH', fns: [F.warn('FLASH — DO NOT USE')],    tags: [], notes: 'Connected to SPI flash — using these will crash the chip' },
                { pin: 'EN',     name: 'EN',      fns: [F.pwr('ENABLE')],                  tags: [], notes: 'Pull LOW to reset / disable chip' },

            notes: `<h3>ESP8266 (NodeMCU v3 / ESP-12E) — Key Points</h3><ul>
                <li>3.3 V I/O — NOT 5 V tolerant; max 12 mA per pin</li>
                <li>Only <strong>1 ADC pin</strong> (A0) — max input 1.0 V (NodeMCU has on-board divider to 3.3 V)</li>
                <li>GPIO6–11: internal flash — <strong>do not use</strong></li>
                <li>GPIO0, GPIO2, GPIO15 control boot mode — avoid external pull-downs on GPIO15, GPIO2 must be HIGH</li>

                { pin: 'GPIO0',  name: 'D3',  fns: [F.warn('Boot pin'), F.pwm()],             tags: ['pwm'], notes: 'Must be HIGH for normal boot; LOW = flash mode; has internal pull-up' },
                { pin: 'GPIO1',  name: 'TXD', fns: [F.uart(0,'TX'), F.warn('Boot pin')],      tags: ['uart'], notes: 'Serial TX; also outputs debug on boot' },

                { pin: 'GPIO16', name: 'D0',  fns: [F.rtc()],                                 tags: [], notes: 'Wake from deep sleep (connect to RST); no PWM/I²C/SPI; no interrupt' },

                { pin: '3V3',    name: '3.3V',fns: [F.pwr('3.3 V out')],                      tags: [], notes: '~500 mA from NodeMCU regulator' },
                { pin: 'GND',    name: 'GND', fns: [F.pwr('GND')],                            tags: [], notes: '' },
                { pin: 'VIN',    name: 'VIN', fns: [F.pwr('5 V in')],                         tags: [], notes: 'NodeMCU on-board regulator input (5 V via USB or pin)' },

        }

    let activePlat = 'uno';
    let activeFn   = 'all';

    function render() {
        const plat = PLATFORMS[activePlat];
        const q    = document.getElementById('search').value.toLowerCase();

        const rows = plat.rows.filter(r => {
            const matchFn  = activeFn === 'all' || r.tags.includes(activeFn);
            const text     = (r.pin + ' ' + r.name + ' ' + r.notes).toLowerCase();
            const matchQ   = !q || text.includes(q);
            return matchFn && matchQ;
        });

        const tbody = document.getElementById('table-body');
        if (rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="no-results">No pins match filter</td></tr>';
        } else {
            tbody.innerHTML = rows.map(r =>
                `<tr>
                    <td class="pin-num">${r.pin}</td>
                    <td class="pin-name">${r.name}</td>
                    <td>${r.fns.join('')}</td>
                    <td class="notes">${r.notes}</td>
                </tr>`
            ).join('');
        }

        document.getElementById('row-count').textContent = `Showing ${rows.length} of ${plat.rows.length} pins`;
        document.getElementById('plat-notes').innerHTML = plat.notes;
    }

    // Platform tabs
    document.getElementById('plat-tabs').addEventListener('click', e => {
        const btn = e.target.closest('.plat-tab');
        if (!btn) return;
        document.querySelectorAll('.plat-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activePlat = btn.dataset.plat;
        document.getElementById('search').value = '';
        activeFn = 'all';
        document.querySelectorAll('.flt-btn').forEach(b => b.classList.toggle('active', b.dataset.fn === 'all'));
        render();
    });

    // Function filter
    document.getElementById('flt-group').addEventListener('click', e => {
        const btn = e.target.closest('.flt-btn');
        if (!btn) return;
        document.querySelectorAll('.flt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFn = btn.dataset.fn;
        render();
    });

    // Search
    document.getElementById('search').addEventListener('input', render);

    render();
    </script>
