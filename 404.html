<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 – Page Not Found | StrokeForge</title>
    <meta name="robots" content="noindex, follow">
    <link rel="stylesheet" href="/css/colors.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .navbar {
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-gray);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .navbar-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo { font-size: 1.5rem; font-weight: 700; color: var(--primary-orange); text-decoration: none; }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { color: var(--light-gray); text-decoration: none; transition: color 0.3s; }
        .nav-links a:hover { color: var(--primary-orange); }

        .error-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 65vh;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: 7rem;
            font-weight: 800;
            color: var(--primary-orange);
            line-height: 1;
            margin-bottom: 1rem;
            font-family: monospace;
        }
        .error-title {
            font-size: 1.8rem;
            color: var(--light-gray);
            margin-bottom: 1rem;
        }
        .error-desc {
            color: var(--text-gray);
            font-size: 1rem;
            margin-bottom: 2rem;
            max-width: 460px;
            line-height: 1.7;
        }
        .home-btn {
            display: inline-block;
            background: var(--primary-orange);
            color: white;
            text-decoration: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        .home-btn:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/index.html" class="nav-logo">StrokeForge</a>
            <div class="nav-links">
                <a href="/index.html">Home</a>
                <a href="/3d-printing.html">3D Printing</a>
                <a href="/electronics.html">Electronics</a>
                <a href="/mechanical.html">Mechanical</a>
                <a href="/other.html">Other</a>
            </div>
            <button class="hamburger" onclick="toggleNav()" aria-label="Toggle menu"><span></span><span></span><span></span></button>
        </div>
    </nav>

    <div class="error-page">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-desc">The page you're looking for doesn't exist or has been moved. Check the URL or head back to the homepage.</p>
        <a href="/index.html" class="home-btn">← Back to Home</a>
    </div>

    <footer class="footer">
        <p>Designs from concept to reality | 2026</p>
    </footer>

    <script src="/js/nav.js"></script>
</body>
</html>
