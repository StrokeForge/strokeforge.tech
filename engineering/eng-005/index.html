          pros:['Tažná — grafit ve tvaru kuliček','Dobrá pevnost pro odlitek','Levná','Tlumení vibrací'],
          cons:['Koroduje','Svařování náročné','Horší obrobitelnost než šedá litina'] },

        // ── PRUŽINOVÁ OCEL ───────────────────────────────────────────────
        { csn:'14 260', en:'60Si2Mn / 1.0961', re:1200, rm:1350, svar:'s', obrob:'o', kor:'n', hm:'H', cena:2, teplota:250, cats:['pruzinova'],
          pouziti:'Listové pružiny, vinuté pružiny, odpružení vozidel',
          pros:['Výborná pružnost a relaxační odolnost','Vysoká mez únavy','Dostupná'],
          cons:['Nesvařitelná','Koroduje','Zpracování obtížné'] },
        { csn:'16 343', en:'51CrV4 / 1.8159', re:900, rm:1100, svar:'s', obrob:'o', kor:'n', hm:'H', cena:2, teplota:250, cats:['pruzinova'],
          pouziti:'Vinuté pružiny, ventilové pružiny, torzní tyče',
          pros:['Výborná únavová pevnost','Houževnatá','Oblíbená pro přesné pružiny'],
          cons:['Nesvařitelná','Koroduje','Obrobitelnost omezená'] },
        { csn:'17 221', en:'17-7PH / 1.4568', re:1100, rm:1300, svar:'o', obrob:'o', kor:'h', hm:'H', cena:4, teplota:370, cats:['pruzinova','nerez'],
          pouziti:'Nerezové pružiny, medicína, potravinářství',
          pros:['Kombinace pevnosti a korozní odolnosti','Nerezová — hygienická','Výborná únava'],
          cons:['Velmi drahá','Svařitelnost omezená','Obtížná obrobitelnost'] },
    ];

    // ═══════════════════════════════════════════════════════════════════════
    // WIZARD STEPS
    // ═══════════════════════════════════════════════════════════════════════
    const STEPS = [
        {
            id: 'zatizeni',
            q: 'Jaký typ zatížení bude součást snášet?',
            hint: 'Určuje požadovanou pevnost, houževnatost a únavové vlastnosti.',
            multi: false,
            opts: [
                { val:'static',  icon:'⬛', label:'Statické',     desc:'Stálé zatížení, žádné rázy ani vibrace (stojan, nosník, rám)' },
                { val:'dynamic', icon:'🔄', label:'Dynamické',    desc:'Střídavé nebo cyklické zatížení (hřídel, ojnice, pero)' },
                { val:'impact',  icon:'💥', label:'Rázové',       desc:'Náhlé nárazy, vibrace (kladiva, zápustky, úchyty)' },
                { val:'wear',    icon:'⚙️', label:'Opotřebení',   desc:'Třecí nebo abrazivní kontakt (vodítka, ozubení, střižníky)' },
                { val:'spring',  icon:'🌀', label:'Pružení',      desc:'Opakovaná elastická deformace (pružiny, péra, klipy)' },
            ]
        },
        {
            id: 'technologie',
            q: 'Jaká výrobní technologie se použije?',
            hint: 'Výběr ovlivňuje svařitelnost a obrobitelnost.',
            multi: true,
            opts: [
                { val:'machining', icon:'🔧', label:'Obrábění',    desc:'Soustružení, frézování, vrtání, broušení' },
                { val:'welding',   icon:'🔥', label:'Svařování',   desc:'MIG/MAG, TIG, elektrodové svařování' },
                { val:'casting',   icon:'🏭', label:'Odlévání',    desc:'Tvarové odlitky, tlakovéodlitky' },
                { val:'forming',   icon:'🔨', label:'Tváření',     desc:'Ohýbání, lisování, tažení, kování' },
            ]
        },
        {
            id: 'prostredi',
            q: 'V jakém prostředí bude součást pracovat?',
            hint: 'Určuje požadavky na korozní odolnost a teplotní stabilitu.',
            multi: false,
            opts: [
                { val:'normal',   icon:'🏠', label:'Běžné prostředí',       desc:'Interiér, stroje, suchý vzduch — bez zvláštních nároků' },
                { val:'outdoor',  icon:'🌧️', label:'Venkovní / vlhkost',    desc:'Déšť, kondenzace, vlhkost — riziko koroze' },
                { val:'chemical', icon:'⚗️', label:'Chemické / agresivní',  desc:'Kyseliny, zásady, chloridy, mořská voda' },
                { val:'food',     icon:'🍽️', label:'Potravinářství / med.', desc:'Hygienické požadavky, čistitelnost, 316L standard' },
                { val:'hightemp', icon:'🌡️', label:'Vysoká teplota >300°C', desc:'Pece, výfuky, obrábění za tepla, kovací nástroje' },
            ]
        },
        {
            id: 'pevnost',
            q: 'Jaká je požadovaná pevnost (Rm)?',
            hint: 'Minimální pevnost v tahu. Pro dynamicky namáhané díly volte o stupeň výše.',
            multi: false,
            opts: [
                { val:'low',      icon:'🟢', label:'Nízká  < 400 MPa',    desc:'Kryty, rámy, nenamáhané díly, nádrže' },
                { val:'medium',   icon:'🟡', label:'Střední 400–700 MPa', desc:'Hřídele, nosníky, příruby, strojní součásti' },
                { val:'high',     icon:'🟠', label:'Vysoká 700–1200 MPa', desc:'Ušlechtilé hřídele, ozubení, šrouby 10.9' },
                { val:'extreme',  icon:'🔴', label:'Extrémní > 1200 MPa', desc:'Pružiny, nástroje, vysoce namáhané díly' },
            ]
        },
        {
            id: 'hmotnost',
            q: 'Jaké jsou požadavky na hmotnost?',
            hint: 'Ovlivňuje výběr mezi ocelí a lehkými slitinami.',
            multi: false,
            opts: [
                { val:'any',      icon:'⚖️', label:'Není důležitá',         desc:'Hmotnost nehraje roli — volný výběr' },
                { val:'reduced',  icon:'🪶', label:'Preferovat lehčí',      desc:'Snížení hmotnosti je žádoucí (Al, titan)' },
                { val:'critical', icon:'🚀', label:'Kriticky důležitá',     desc:'Minimální hmotnost za každou cenu (letectví, sport)' },
            ]
        },
    ];

    // ═══════════════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════════════
    let step = 0;
    let answers = {}; // stepId → val or [vals]

    // ═══════════════════════════════════════════════════════════════════════
    // SCORING
    // ═══════════════════════════════════════════════════════════════════════
    function score(m, ans) {
        let s = 0;

        // ── Zatížení ──────────────────────────────────────────────────────
        const zat = ans.zatizeni;
        if (zat === 'static') {
            // Anything works, prefer cheap
            if (m.cena === 1) s += 2;
        }
        if (zat === 'dynamic') {
            // Need moderate-high strength + some toughness
            if (m.rm && m.rm >= 400) s += 3;
            if (m.rm && m.rm >= 700) s += 2;
            if (m.cats.includes('litina')) s -= 3; // brittle
            if (m.cats.includes('pruzinova')) s += 1;
        }
        if (zat === 'impact') {
            if (m.rm && m.rm >= 700) s += 2;
            if (m.cats.includes('litina')) s -= 5; // brittle = bad for impact
            if (['19 083','19 550'].includes(m.csn)) s -= 3; // tool steels = brittle
            if (['13 240','15 230'].includes(m.csn)) s += 3; // tough alloy steels
        }
        if (zat === 'wear') {
            if (m.cats.includes('nastrojova')) s += 5;
            if (['11 600','12 050'].includes(m.csn)) s += 2; // hardenable
            if (m.cats.includes('litina') && m.csn === '42 2420') s += 1;
            if (m.cats.includes('hlinik')) s -= 2; // soft
        }
        if (zat === 'spring') {
            if (m.cats.includes('pruzinova')) s += 6;
            if (m.cats.includes('nastrojova')) s -= 2;
            if (m.cats.includes('litina')) s -= 5;
        }

        // ── Technologie ───────────────────────────────────────────────────
        const tech = ans.technologie || [];
        if (tech.includes('welding')) {
            const w = { v:4, d:2, o:-1, s:-5 };
            s += (w[m.svar] || 0);
        }
        if (tech.includes('machining')) {
            const o = { v:3, d:2, o:0, s:-3 };
            s += (o[m.obrob] || 0);
        }
        if (tech.includes('casting')) {
            if (m.cats.includes('litina')) s += 5;
            if (m.cats.includes('hlinik')) s += 2;
            if (!m.cats.includes('litina') && !m.cats.includes('hlinik')) s -= 1;
        }
        if (tech.includes('forming')) {
            if (m.cats.includes('litina')) s -= 4; // brittle
            if (m.cats.includes('nastrojova') && !['19 732'].includes(m.csn)) s -= 3;
            if (m.cats.includes('hlinik')) s += 1;
            if (['11 373','11 523'].includes(m.csn)) s += 3; // great formability
        }

        // ── Prostředí ─────────────────────────────────────────────────────
        const prost = ans.prostredi;
        if (prost === 'normal') {
            // No penalty, prefer cheap
            if (m.cena === 1) s += 1;
        }
        if (prost === 'outdoor') {
            if (m.kor === 'h') s += 3;
            if (m.kor === 's') s += 1;
            if (m.kor === 'n') s -= 3;
        }
        if (prost === 'chemical') {
            if (m.kor === 'h') s += 5;
            if (m.kor === 's') s -= 1;
            if (m.kor === 'n') s -= 5;
            // 316/316L best
            if (['17 248','17 349','17 465'].includes(m.csn)) s += 3;
        }
        if (prost === 'food') {
            if (m.kor === 'h') s += 5;
            else s -= 5;
            if (['17 246','17 349','17 248'].includes(m.csn)) s += 3;
            if (m.cats.includes('nastrojova')) s -= 3;
            if (m.cats.includes('litina')) s -= 3;
        }
        if (prost === 'hightemp') {
            if (m.teplota >= 500) s += 4;
            else if (m.teplota >= 300) s += 2;
            else if (m.teplota < 200) s -= 4;
            if (m.cats.includes('hlinik')) s -= 5;
            if (['19 437','19 452','17 465'].includes(m.csn)) s += 2;
        }

        // ── Pevnost ───────────────────────────────────────────────────────
        const pev = ans.pevnost;
        const rm = m.rm;
        if (pev === 'low') {
            if (!rm || rm < 400) s += 3;
            else if (rm < 600) s += 1;
            else s -= 1; // overkill — not a penalty, just not preferred
        }
        if (pev === 'medium') {
            if (rm && rm >= 400 && rm < 700) s += 4;
            else if (rm && rm >= 300 && rm < 900) s += 2;
            else s -= 1;
        }
        if (pev === 'high') {
            if (rm && rm >= 700 && rm < 1200) s += 4;
            else if (rm && rm >= 500) s += 2;
            else if (!rm || rm < 400) s -= 3;
        }
        if (pev === 'extreme') {
            if (rm && rm >= 1200) s += 5;
            else if (rm && rm >= 900) s += 3;
            else if (!rm || rm < 700) s -= 3;
            // Tool steels — no Rm but very hard
            if (m.cats.includes('nastrojova') && m.csn !== '19 732') s += 3;
        }

        // ── Hmotnost ──────────────────────────────────────────────────────
        const hm = ans.hmotnost;
        if (hm === 'reduced') {
            if (m.hm === 'L') s += 3;
            if (m.hm === 'M') s += 1;
        }
        if (hm === 'critical') {
            if (m.hm === 'L') s += 5;
            if (m.hm === 'H') s -= 3;
        }

        return s;
    }

    // ═══════════════════════════════════════════════════════════════════════
    // RENDER
    // ═══════════════════════════════════════════════════════════════════════
    function renderProgress() {
        const stepsEl = document.getElementById('progress-steps');
        stepsEl.innerHTML = '';
        STEPS.forEach((_, i) => {
            const d = document.createElement('div');
            d.className = 'step-dot' + (i < step ? ' done' : i === step ? ' current' : '');
            stepsEl.appendChild(d);
        });
        document.getElementById('progress-label').textContent =
            step < STEPS.length ? `Krok ${step+1} z ${STEPS.length}` : 'Výsledky';
    }

    function renderStep() {
        const s = STEPS[step];
        const sel = answers[s.id] || (s.multi ? [] : null);

        let html = `
            <div class="step-num">KROK ${step+1} / ${STEPS.length}</div>
            <div class="step-q">${s.q}</div>
            <div class="step-hint">${s.hint}</div>
            ${s.multi ? '<div class="multi-hint">✦ Lze vybrat více možností</div>' : ''}
            <div class="options-grid${s.opts.length >= 4 ? '' : ' cols3'}">
        `;
        s.opts.forEach(o => {
            const isSelected = s.multi
                ? (sel.includes(o.val))
                : (sel === o.val);
            html += `
                <div class="opt-card${isSelected?' selected':''}" onclick="selectOpt('${s.id}','${o.val}',${s.multi})">
                    <span class="opt-check">✓</span>
                    <div class="opt-icon">${o.icon}</div>
                    <div class="opt-label">${o.label}</div>
                    <div class="opt-desc">${o.desc}</div>
                </div>
            `;
        });
        html += `</div>
            <div class="wizard-nav">
                <button class="btn-back" onclick="goBack()" ${step===0?'style="visibility:hidden"':''}>← Zpět</button>
                <button class="btn-next" id="btn-next" onclick="goNext()" ${!hasAnswer(s.id,s.multi)?'disabled':''}>
                    ${step === STEPS.length-1 ? 'Zobrazit výsledky →' : 'Další →'}
                </button>
            </div>
        `;
        document.getElementById('wizard-card').innerHTML = html;
    }

    function hasAnswer(id, multi) {
        if (multi) return (answers[id] || []).length > 0;
        return answers[id] != null;
    }

    function selectOpt(id, val, multi) {
        if (multi) {
            if (!answers[id]) answers[id] = [];
            const idx = answers[id].indexOf(val);
            if (idx >= 0) answers[id].splice(idx, 1);
            else answers[id].push(val);
        } else {
            answers[id] = val;
        }
        renderStep();
    }

    function goBack() {
        if (step > 0) { step--; renderProgress(); renderStep(); }
    }

    function goNext() {
        const s = STEPS[step];
        if (!hasAnswer(s.id, s.multi)) return;
        step++;
        renderProgress();
        if (step >= STEPS.length) renderResults();
        else renderStep();
    }

    // ── RESULTS ───────────────────────────────────────────────────────────
    function renderResults() {
        const scored = MAT.map(m => ({ m, s: score(m, answers) }))
            .sort((a,b) => b.s - a.s);

        const maxS = scored[0].s;
        const top  = scored.slice(0, 5).filter(x => x.s > 0);

        // Summary chips
        const stepLabels = {
            zatizeni:    STEPS[0].opts.find(o => o.val === answers.zatizeni)?.label,
            technologie: (answers.technologie||[]).map(v => STEPS[1].opts.find(o=>o.val===v)?.label).join(', '),
            prostredi:   STEPS[2].opts.find(o => o.val === answers.prostredi)?.label,
            pevnost:     STEPS[3].opts.find(o => o.val === answers.pevnost)?.label,
            hmotnost:    STEPS[4].opts.find(o => o.val === answers.hmotnost)?.label,
        };
        const chips = Object.entries(stepLabels).filter(([,v])=>v).map(([,v]) =>
            `<span class="s-chip">${v}</span>`).join('');

        let html = `
            <div class="results-header">
                <h2>Doporučené materiály</h2>
                <p>Na základě tvých požadavků — od nejlépe po méně vhodné.</p>
            </div>
            <div class="summary-chips">${chips}</div>
        `;

        if (top.length === 0) {
            html += `<div class="no-results">Nepodařilo se najít ideální shodu. Zkus změnit požadavky — kombinace může být vzájemně vylučující.</div>`;
        } else {
            top.forEach(({m, s: sc}, i) => {
                const pct = Math.round((sc / maxS) * 100);
                const rankCls = i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : 'rank-3';
                html += `
                    <div class="result-card ${rankCls}">
                        <div class="result-rank">#${i+1}</div>
                        <div class="result-top">
                            <div class="result-name">
                                <div class="rn-csn">ČSN ${m.csn}</div>
                                <div class="rn-en">${m.en}</div>
                            </div>
                            <div class="result-score">
                                <div class="score-bar-wrap">
                                    <div class="score-label">Shoda</div>
                                    <div class="score-bar"><div class="score-fill" style="width:${pct}%"></div></div>
                                    <div class="score-pct">${pct}%</div>
                                </div>
                            </div>
                        </div>
                        <div class="result-props">
                            ${m.re ? `<div class="prop-chip">Re <span>${m.re} MPa</span></div>` : ''}
                            ${m.rm ? `<div class="prop-chip">Rm <span>${m.rm} MPa</span></div>` : ''}
                            <div class="prop-chip">Svař. <span>${{v:'výborná',d:'dobrá',o:'omezená',s:'špatná'}[m.svar]}</span></div>
                            <div class="prop-chip">Obrob. <span>${{v:'výborná',d:'dobrá',o:'omezená',s:'špatná'}[m.obrob]}</span></div>
                            <div class="prop-chip">Cena <span>${['','nízká','střední','vyšší','vysoká'][m.cena]}</span></div>
                        </div>
                        <div style="font-size:0.8rem;color:var(--text-gray);margin-bottom:0.75rem">${m.pouziti}</div>
                        <div class="result-pros-cons">
                            <div class="pros">
                                <div class="pros-label">✓ Výhody pro tvůj případ</div>
                                <ul>${m.pros.map(p=>`<li>${p}</li>`).join('')}</ul>
                            </div>
                            <div class="cons">
                                <div class="cons-label">− Nevýhody / kompromisy</div>
                                <ul>${m.cons.map(c=>`<li>${c}</li>`).join('')}</ul>
                            </div>
                        </div>
                        <a class="eng004-link" href="../eng-004/" target="_blank">→ Zobrazit detail v tabulce materiálů</a>
                    </div>
                `;
            });
        }

        html += `
            <div class="wizard-nav" style="margin-top:1.5rem">
                <button class="btn-restart" onclick="restart()">← Začít znovu</button>
                <a href="../eng-004/" style="font-size:0.82rem;color:var(--primary-orange);text-decoration:none">Celá tabulka materiálů →</a>
            </div>
        `;

        document.getElementById('wizard-card').innerHTML = html;
    }

    function restart() {
        step = 0;
        answers = {};
        renderProgress();
        renderStep();
    }

    // ── INIT ──────────────────────────────────────────────────────────────
    renderProgress();
    renderStep();
    </script>
</body>
</html>
