<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | StrokeForge</title>
    <link rel="stylesheet" href="css/colors.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Projects specific styles */
        .navbar {
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-gray);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .navbar-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-orange);
            text-decoration: none;
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
        }
        
        .nav-links a {
            color: var(--light-gray);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .nav-links a:hover {
            color: var(--primary-orange);
        }
        
        .projects-header {
            text-align: center;
            padding: 3rem 2rem;
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%);
        }
        
        .projects-header h1 {
            font-size: 2.5rem;
            color: var(--primary-orange);
            margin-bottom: 1rem;
        }
        
        .filter-section {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        
        .filter-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .filter-btn {
            background: var(--card-bg);
            border: 2px solid var(--border-gray);
            color: var(--light-gray);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            font-weight: 500;
        }
        
        .filter-btn:hover {
            border-color: var(--primary-orange);
            transform: translateY(-2px);
        }
        
        .filter-btn.active {
            background: var(--primary-orange);
            border-color: var(--primary-orange);
            color: white;
        }
        
        .projects-grid {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }
        
        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gray);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-orange);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.2);
        }
        
        .project-image {
            width: 100%;
            height: 220px;
            background: var(--darker-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-gray);
            font-size: 4rem;
            overflow: hidden;
        }
        
        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .project-content {
            padding: 1.5rem;
        }
        
        .project-title {
            font-size: 1.4rem;
            color: var(--light-gray);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }
        
        .project-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-gray);
            flex-wrap: wrap;
        }
        
        .project-meta span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .project-description {
            color: var(--text-gray);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        .project-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }
        
        .tag {
            background: rgba(255, 107, 53, 0.1);
            border: 1px solid var(--primary-orange);
            padding: 0.25rem 0.75rem;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--primary-orange);
        }
        
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-gray);
        }
        
        .empty-state h2 {
            color: var(--primary-orange);
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                gap: 1rem;
            }
            
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="nav-logo">StrokeForge</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="projects.html">Projects</a>
                <a href="models.html">3D Models</a>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="projects-header">
        <h1>All Projects</h1>
        <p style="color: var(--text-gray); font-size: 1.1rem;">
            From concept to reality – documented engineering projects
        </p>
    </header>

    <!-- Filter Section -->
    <section class="filter-section">
        <div class="filter-buttons">
            <button class="filter-btn active" data-category="all">All Projects</button>
            <button class="filter-btn" data-category="3d-print">🖨️ 3D Print</button>
            <button class="filter-btn" data-category="electronics">⚡ Electronics</button>
            <button class="filter-btn" data-category="mechanical">🔧 Mechanical</button>
            <button class="filter-btn" data-category="other">📦 Other</button>
        </div>
    </section>

    <!-- Projects Grid -->
    <section class="projects-grid" id="projects-grid">
        <!-- Projects loaded by JavaScript -->
        <div class="empty-state">
            <h2>🚀 No Projects Yet</h2>
            <p>First project coming soon...</p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>Designs from concept to reality | 2025</p>
    </footer>

    <!-- JavaScript -->
    <script src="js/projects.js"></script>
</body>
</html>
