    <style>
        /* Navigation */
        .navbar {
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-gray);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .navbar-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-orange);
            text-decoration: none;
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
        }
        
        .nav-links a {
            color: var(--light-gray);
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .nav-links a:hover,
        .nav-links a.active {
            color: var(--primary-orange);
        }
        
        /* Page Header */
        .page-header {
            text-align: center;
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%);
        }

        .page-header h1 {
            font-size: 2rem;
            color: var(--primary-orange);
            margin-bottom: 0.5rem;
        }

        .page-header p {
            font-size: 1rem;
            color: var(--text-gray);
        }
        
        /* Projects Grid */
        .projects-grid {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }
        
        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gray);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }
        
        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-orange);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.2);
        }
        
        .project-image {
            width: 100%;
            height: 220px;
            background: var(--darker-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-gray);
            font-size: 4rem;
            overflow: hidden;
        }
        
        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .project-content {
            padding: 1.5rem;
        }
        
        .project-title {
            font-size: 1.4rem;
            color: var(--light-gray);
            margin-bottom: 0.75rem;
            font-weight: 600;
        }
        
        .project-meta {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-gray);
            flex-wrap: wrap;
        }
        
        .project-meta span {
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .difficulty-beginner { color: #48bb78; }
        .difficulty-intermediate { color: #f59e0b; }
        .difficulty-advanced { color: #ef4444; }
        
        .project-description {
            color: var(--text-gray);
            font-size: 0.95rem;
            line-height: 1.6;
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-gray);
            grid-column: 1 / -1;
        }
        
        .empty-state h2 {
            color: var(--primary-orange);
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                gap: 1rem;
                font-size: 0.9rem;
            }
            
            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

                <a href="mechanical.html">Mechanical</a>
                <a href="other.html">Other</a>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="page-header">
        <h1>⚡ Electronics Projects</h1>
        <p>Arduino, ESP32, and embedded systems</p>
    </header>

    <!-- Projects Grid -->
    <section class="projects-grid">
        <div style="grid-column: 1/-1; text-align: center; padding: 4rem 2rem; background: var(--card-bg); border-radius: 12px; border: 2px dashed var(--border-gray);">
            <div style="font-size: 4rem; margin-bottom: 1rem;">🔧</div>
            <h2 style="color: var(--primary-orange); font-size: 2rem; margin-bottom: 1rem;">Coming Soon</h2>
            <p style="color: var(--text-gray); font-size: 1.2rem;">New electronics projects will be added soon. Stay tuned!</p>
            <p style="color: var(--text-gray); font-size: 1rem; margin-top: 0.5rem;">Arduino, ESP32, sensors, and more...</p>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>Designs from concept to reality | 2026</p>
        <p style="margin-top: 0.5rem; font-size: 0.8rem;">
            <a href="https://www.printables.com/@TechMaster" target="_blank" style="color: #ff6b35; text-decoration: none;">
                Printables: @TechMaster
            </a>
        </p>
    </footer>
</body>
</html>
