    <style>
        /* Navigation */
        .navbar {
            background: rgba(0, 0, 0, 0.5);
            padding: 1rem 2rem;
            border-bottom: 1px solid var(--border-gray);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .navbar-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo { font-size: 1.5rem; font-weight: 700; color: var(--primary-orange); text-decoration: none; }
        .nav-links { display: flex; gap: 2rem; }
        .nav-links a { color: var(--light-gray); text-decoration: none; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-orange); }

        /* Page Header */
        .page-header {
            text-align: center;
            padding: 1.5rem 2rem;
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%);
        }
        .page-header h1 { font-size: 2rem; color: var(--primary-orange); margin-bottom: 0.5rem; }
        .page-header p { font-size: 1rem; color: var(--text-gray); }

        /* Projects Grid */
        .projects-grid {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }
        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-gray);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
        }
        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-orange);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.2);
        }
        .project-image {
            width: 100%;
            height: 220px;
            background: var(--darker-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-gray);
            font-size: 4rem;
            overflow: hidden;
        }
        .project-image img { width: 100%; height: 100%; object-fit: cover; }
        .project-content { padding: 1.5rem; }
        .project-title { font-size: 1.4rem; color: var(--light-gray); margin-bottom: 0.75rem; font-weight: 600; }
        .project-meta { display: flex; gap: 1rem; margin-bottom: 1rem; font-size: 0.85rem; color: var(--text-gray); flex-wrap: wrap; }
        .project-description { color: var(--text-gray); font-size: 0.95rem; line-height: 1.6; }

        /* Category navbar */
        .category-navbar {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--primary-orange);
            position: sticky;
            top: 70px;
            z-index: 90;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .category-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0.5rem 2rem;
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-orange) rgba(0,0,0,0.3);
        }
        .category-container::-webkit-scrollbar { height: 6px; }
        .category-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .category-container::-webkit-scrollbar-thumb { background: var(--primary-orange); border-radius: 3px; }
        .category-link {
            display: flex; flex-direction: column; align-items: center;
            gap: 0.15rem; padding: 0.4rem 1rem; min-width: 90px;
            background: var(--card-bg); border: 2px solid var(--border-gray);
            border-radius: 8px; color: var(--light-gray);
            text-decoration: none; white-space: nowrap;
            transition: all 0.3s ease; font-weight: 500;
        }
        .category-link:hover { border-color: var(--primary-orange); background: rgba(255,107,53,0.1); transform: translateY(-2px); }
        .category-link.active { border-color: var(--primary-orange); background: var(--primary-orange); color: var(--dark-bg); box-shadow: 0 4px 10px rgba(255,107,53,0.3); }
        .category-icon { font-size: 1.1rem; line-height: 1; }
        .category-text { font-size: 0.75rem; line-height: 1; }

        /* Empty state */
        .empty-state {
            text-align: center; padding: 4rem 2rem;
            color: var(--text-gray); grid-column: 1 / -1;
        }
        .empty-state h2 { color: var(--primary-orange); font-size: 2rem; margin-bottom: 1rem; }

        @media (max-width: 768px) {
            .nav-links { gap: 1rem; font-size: 0.9rem; }
            .projects-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
